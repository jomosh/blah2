<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>blah2 — Alignment</title>
  <!-- load lib js -->
  <script src="../../lib/bootstrap-5.2.3.min.js"></script>
  <script src="../../lib/plotly-2.20.0.min.js"></script>
  <script src="../../lib/jquery-3.6.4.min.js"></script>
  <!-- load lib css -->
  <link rel="stylesheet" href="../../lib/bootstrap-5.2.3.min.css">
  <link rel="stylesheet" href="../../lib/blah2.css">
  <style>
    body { background: #111; color: #ccc; }
    .gauge-box {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin: 4px 0;
    }
    .gauge-label {
      font-size: 12px;
      text-transform: uppercase;
      color: #888;
    }
    .gauge-value {
      font-size: 28px;
      font-weight: bold;
      font-family: monospace;
    }
    .gauge-ref .gauge-value { color: #4fc3f7; }
    .gauge-surv .gauge-value { color: #ff8a65; }
    .gauge-isolation .gauge-value { color: #81c784; }
    .gauge-isolation.warn .gauge-value { color: #fff176; }
    .gauge-isolation.bad .gauge-value { color: #e57373; }
    .plot-container {
      background: #1a1a1a;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .btn-sm-custom {
      font-size: 11px;
      padding: 2px 8px;
    }
  </style>
</head>
<body>
  <div style="height: 100vh; width: 98vw" class="container-fluid px-2 py-1">
    <!-- Power Meters Row -->
    <div class="row g-1 mb-2">
      <div class="col-md-4">
        <div class="gauge-box gauge-ref">
          <div class="gauge-label">Reference Total Power</div>
          <div class="gauge-value" id="gauge-ref">-- dB</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="gauge-box gauge-surv">
          <div class="gauge-label">Surveillance Total Power</div>
          <div class="gauge-value" id="gauge-surv">-- dB</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="gauge-box gauge-isolation" id="gauge-isolation-box">
          <div class="gauge-label">Isolation (Ref − Surv)</div>
          <div class="gauge-value" id="gauge-isolation">-- dB</div>
        </div>
      </div>
    </div>

    <!-- Spectrum Overlay + Peak-Hold Row -->
    <div class="row g-1 mb-2">
      <div class="col-md-8">
        <div class="plot-container">
          <div class="d-flex justify-content-between align-items-center px-2 pt-2">
            <span class="small text-uppercase text-muted">Spectrum Overlay (live)</span>
          </div>
          <div class="justify-content-center" id="plot-spectrum-overlay" style="height: 28vh;"></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="plot-container">
          <div class="d-flex justify-content-between align-items-center px-2 pt-2">
            <span class="small text-uppercase text-muted">Peak Hold</span>
            <button class="btn btn-sm btn-outline-secondary btn-sm-custom" id="btn-reset-peakhold">Reset</button>
          </div>
          <div class="justify-content-center" id="plot-peakhold" style="height: 28vh;"></div>
        </div>
      </div>
    </div>

    <!-- Constellation Diagrams Row -->
    <div class="row g-1 mb-2">
      <div class="col-md-6">
        <div class="plot-container">
          <div class="px-2 pt-2">
            <span class="small text-uppercase text-muted">Reference Constellation (I/Q)</span>
          </div>
          <div class="justify-content-center" id="plot-const-ref" style="height: 28vh;"></div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="plot-container">
          <div class="px-2 pt-2">
            <span class="small text-uppercase text-muted">Surveillance Constellation (I/Q)</span>
          </div>
          <div class="justify-content-center" id="plot-const-surv" style="height: 28vh;"></div>
        </div>
      </div>
    </div>

    <!-- Dual Waterfall Row -->
    <div class="row g-1">
      <div class="col-md-6">
        <div class="plot-container">
          <div class="px-2 pt-2">
            <span class="small text-uppercase text-muted">Reference Waterfall</span>
          </div>
          <div class="justify-content-center" id="plot-waterfall-ref" style="height: 28vh;"></div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="plot-container">
          <div class="px-2 pt-2">
            <span class="small text-uppercase text-muted">Surveillance Waterfall</span>
          </div>
          <div class="justify-content-center" id="plot-waterfall-surv" style="height: 28vh;"></div>
        </div>
      </div>
    </div>
  </div>
</body>
<script src="../../js/common.js"></script>
<script src="../../js/plot_alignment.js"></script>
</html>

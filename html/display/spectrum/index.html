<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>blah2</title>
  <!-- load lib js -->
  <script src="../../lib/bootstrap-5.2.3.min.js"></script>
  <script src="../../lib/plotly-2.20.0.min.js"></script>
  <script src="../../lib/jquery-3.6.4.min.js"></script>
  <!-- load lib css -->
  <link rel="stylesheet" href="../../lib/bootstrap-5.2.3.min.css">
  <link rel="stylesheet" href="../../lib/blah2.css">
  <style>
  </style>
</head>
<body>
  <div style="height: 100vh; width: 95vw" class="container-fluid">
    <div class="d-flex justify-content-center gap-2 py-2">
      <button class="btn btn-sm btn-primary" id="btn-spectrum-ref">Reference</button>
      <button class="btn btn-sm btn-outline-secondary" id="btn-spectrum-surv">Surveillance</button>
      <button class="btn btn-sm btn-outline-secondary" id="btn-spectrum-both">Both</button>
    </div>
    <div style="height: calc(100vh - 50px); width: 95vw" class="row d-flex">
      <div class="justify-content-center" id="data"></div>
    </div>
</body>
<script>
// Toggle button handlers
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('btn-spectrum-ref').addEventListener('click', function() {
    viewMode = 'ref';
    nRows = 3; // force re-create
    this.className = 'btn btn-sm btn-primary';
    document.getElementById('btn-spectrum-surv').className = 'btn btn-sm btn-outline-secondary';
    document.getElementById('btn-spectrum-both').className = 'btn btn-sm btn-outline-secondary';
  });
  document.getElementById('btn-spectrum-surv').addEventListener('click', function() {
    viewMode = 'surv';
    nRows = 3;
    this.className = 'btn btn-sm btn-primary';
    document.getElementById('btn-spectrum-ref').className = 'btn btn-sm btn-outline-secondary';
    document.getElementById('btn-spectrum-both').className = 'btn btn-sm btn-outline-secondary';
  });
  document.getElementById('btn-spectrum-both').addEventListener('click', function() {
    viewMode = 'both';
    nRows = 3;
    this.className = 'btn btn-sm btn-primary';
    document.getElementById('btn-spectrum-ref').className = 'btn btn-sm btn-outline-secondary';
    document.getElementById('btn-spectrum-surv').className = 'btn btn-sm btn-outline-secondary';
  });
});
</script>
<script src="../../js/common.js"></script>
<script src="../../js/plot_spectrum.js"></script>

</html>
